<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hymn &amp; Frame — Worship Social Caption Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --surface-warm: #F4EFE6;
      --text: #1E1C1A;
      --text-muted: #6A635B;
      --accent: #A66E38;
      --accent-hover: #8C5A2B;
      --accent-soft: #F7EFE5;
      --border: #E5DDD0;
      --border-focus: #A66E38;
      --success: #2F6F4E;
      --shadow-sm: 0 2px 8px rgba(30, 28, 26, 0.04);
      --shadow-md: 0 10px 30px rgba(30, 28, 26, 0.06);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      padding: 36px 20px 72px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(1.9rem, 3.6vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.96rem;
      max-width: 560px;
      margin: 0 auto;
    }

    .workspace {
